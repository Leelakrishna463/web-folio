name: CI
on:
  push: { branches: [main, v2] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env: { PW_CHROMIUM: '1', CI: '1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Lighthouse scores the production build (no test fixtures)
      - run: npm run build
      - run: npx --yes @lhci/cli@0.14.0 autorun
